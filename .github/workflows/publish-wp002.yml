name: Publish XBX-RSP-WP-002

on:
  schedule:
    # September 15 at 12:37 UTC = 8:37 AM EDT (America/New_York)
    # Cron has no year field, so the workflow includes an explicit 2026 date gate.
    - cron: '37 12 15 9 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-xbx-rsp-wp-002
  cancel-in-progress: false

env:
  TARGET_DATE: '2026-09-15'
  STAGING_TAG: 'wp002-staging'
  DEST_DIR: 'publications/XBX-RSP-WP-002'
  EXPECTED_HTML_SHA256: '867bce17f3a495651012b671e8c30a4586b8d956f3e0fceb223853ef775fea7e'
  EXPECTED_PDF_SHA256: '6bbb4dbd87b13139e1ab73a1284f2bcd706046e784b9176134d36669f52c4e87'

jobs:
  stage-check-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Determine whether this run may publish
        id: gate
        shell: bash
        run: |
          TODAY_UTC="$(date -u +%F)"

          echo "GitHub event: ${GITHUB_EVENT_NAME}"
          echo "UTC date: ${TODAY_UTC}"
          echo "Target date: ${TARGET_DATE}"

          # Manual runs are verification-only and can never publish.
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${TODAY_UTC}" == "${TARGET_DATE}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled publication gate OPEN."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Publication gate CLOSED. This run will verify staging only."
          fi

      - name: Locate draft staging release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="$(
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/releases?per_page=100"               --jq ".[] | select(.draft == true and .tag_name == \"${STAGING_TAG}\") | .id"               | head -n 1
          )"

          if [[ -z "${RELEASE_ID}" ]]; then
            echo "::error::Draft release with tag ${STAGING_TAG} was not found."
            exit 1
          fi

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "Found staging draft release ID ${RELEASE_ID}."

      - name: Locate required staging assets
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ steps.release.outputs.release_id }}"

          HTML_ID="$(
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100"               --jq '.[] | select(.name == "index.html") | .id'               | head -n 1
          )"

          PDF_ID="$(
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100"               --jq '.[] | select(.name == "XBX-RSP-WP-002.pdf") | .id'               | head -n 1
          )"

          if [[ -z "${HTML_ID}" ]]; then
            echo "::error::Required staging asset index.html was not found."
            exit 1
          fi

          if [[ -z "${PDF_ID}" ]]; then
            echo "::error::Required staging asset XBX-RSP-WP-002.pdf was not found."
            exit 1
          fi

          echo "html_id=${HTML_ID}" >> "$GITHUB_OUTPUT"
          echo "pdf_id=${PDF_ID}" >> "$GITHUB_OUTPUT"
          echo "Both required staging assets were found."

      - name: Download staged files for verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/wp002-stage

          curl --fail --location             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/octet-stream"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${{ steps.assets.outputs.html_id }}"             --output /tmp/wp002-stage/index.html

          curl --fail --location             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/octet-stream"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${{ steps.assets.outputs.pdf_id }}"             --output /tmp/wp002-stage/XBX-RSP-WP-002.pdf

          test -s /tmp/wp002-stage/index.html
          test -s /tmp/wp002-stage/XBX-RSP-WP-002.pdf

      - name: Verify staged-file integrity
        shell: bash
        run: |
          HTML_SHA="$(sha256sum /tmp/wp002-stage/index.html | awk '{print $1}')"
          PDF_SHA="$(sha256sum /tmp/wp002-stage/XBX-RSP-WP-002.pdf | awk '{print $1}')"

          echo "index.html SHA-256: ${HTML_SHA}"
          echo "XBX-RSP-WP-002.pdf SHA-256: ${PDF_SHA}"

          if [[ "${HTML_SHA}" != "${EXPECTED_HTML_SHA256}" ]]; then
            echo "::error::index.html does not match the approved staged file."
            exit 1
          fi

          if [[ "${PDF_SHA}" != "${EXPECTED_PDF_SHA256}" ]]; then
            echo "::error::XBX-RSP-WP-002.pdf does not match the approved staged file."
            exit 1
          fi

          echo "Staged-file integrity verified."

      - name: Stop after verification on manual/non-target runs
        if: steps.gate.outputs.publish != 'true'
        shell: bash
        run: |
          echo "Verification successful."
          echo "No public files were changed."
          echo "Scheduled public release remains set for ${TARGET_DATE}."

      - name: Publish WP-002 files into GitHub Pages source
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          mkdir -p "${DEST_DIR}"

          cp /tmp/wp002-stage/index.html "${DEST_DIR}/index.html"
          cp /tmp/wp002-stage/XBX-RSP-WP-002.pdf "${DEST_DIR}/XBX-RSP-WP-002.pdf"

          echo "Files staged in ${DEST_DIR}."

      - name: Add WP-002 to sitemap
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          sitemap = Path("sitemap.xml")
          publication_url = (
              "https://xbxbio.github.io/connected-cardiovascular-intelligence/"
              "publications/XBX-RSP-WP-002/"
          )

          entry = (
              "  <url>\n"
              f"    <loc>{publication_url}</loc>\n"
              "    <lastmod>2026-09-15</lastmod>\n"
              "  </url>\n"
          )

          if sitemap.exists():
              text = sitemap.read_text(encoding="utf-8")
              if publication_url not in text:
                  if "</urlset>" not in text:
                      raise SystemExit("Existing sitemap.xml has no closing </urlset> tag.")
                  text = text.replace("</urlset>", entry + "</urlset>")
                  sitemap.write_text(text, encoding="utf-8")
                  print("WP-002 added to existing sitemap.")
              else:
                  print("WP-002 is already present in sitemap; no change needed.")
          else:
              sitemap.write_text(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
                  + entry +
                  '</urlset>\n',
                  encoding="utf-8",
              )
              print("Created sitemap.xml with WP-002.")
          PY

      - name: Commit public publication to main
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${DEST_DIR}/index.html"
          git add "${DEST_DIR}/XBX-RSP-WP-002.pdf"
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "WP-002 is already published; no commit required."
            exit 0
          fi

          git commit -m "Publish XBX-RSP-WP-002"
          git push origin main

      - name: Publication summary
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          {
            echo "## XBX-RSP-WP-002 published"
            echo
            echo "**Publication date:** September 15, 2026"
            echo
            echo "**Public page:**"
            echo "https://xbxbio.github.io/connected-cardiovascular-intelligence/publications/XBX-RSP-WP-002/"
            echo
            echo "**Public PDF:**"
            echo "https://xbxbio.github.io/connected-cardiovascular-intelligence/publications/XBX-RSP-WP-002/XBX-RSP-WP-002.pdf"
            echo
            echo "Google Scholar indexing is crawler-controlled and is not guaranteed to occur immediately."
          } >> "$GITHUB_STEP_SUMMARY"
