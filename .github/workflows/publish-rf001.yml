      - name: Add RF-001 to sitemap
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          sitemap = Path("sitemap.xml")

          publication_url = (
              "https://xbxbio.github.io/"
              "connected-cardiovascular-intelligence/"
              "publications/XBX-RSP-RF-001/"
          )

          entry = (
              "  <url>\n"
              f"    <loc>{publication_url}</loc>\n"
              "    <lastmod>2026-09-17</lastmod>\n"
              "  </url>\n"
          )

          if sitemap.exists():
              text = sitemap.read_text(encoding="utf-8")

              if publication_url in text:
                  print("RF-001 already exists in sitemap.")

              else:
                  if "</urlset>" not in text:
                      raise SystemExit(
                          "Existing sitemap.xml has no closing "
                          "</urlset> tag."
                      )

                  text = text.replace(
                      "</urlset>",
                      entry + "</urlset>",
                  )

                  sitemap.write_text(
                      text,
                      encoding="utf-8",
                  )

                  print("RF-001 added to sitemap.")

          else:
              sitemap.write_text(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<urlset xmlns="http://www.sitemaps.org/'
                  'schemas/sitemap/0.9">\n'
                  + entry
                  + '</urlset>\n',
                  encoding="utf-8",
              )

              print("Created sitemap.xml containing RF-001.")
          PY

      - name: Publish and verify RF-001 in Zenodo
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          python3 /tmp/zenodo_rf001.py publish

      - name: Commit public RF-001 files to main
        id: commit
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${DEST_DIR}/index.html"
          git add "${DEST_DIR}/${PDF_NAME}"
          git add "${DEST_DIR}/${DOCX_NAME}"
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "RF-001 public files are already present."
          else
            git commit -m "Publish XBX-RSP-RF-001"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

          published_sha="$(git rev-parse HEAD)"
          echo "published_sha=${published_sha}" >> "$GITHUB_OUTPUT"
          echo "Published main-branch revision: ${published_sha}"

      - name: Publish RF-001 GitHub release
        if: >-
          steps.gate.outputs.publish == 'true' &&
          steps.release.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method PATCH \
            "repos/${{ github.repository }}/releases/${{ steps.release.outputs.release_id }}" \
            -f draft=false \
            -f prerelease=false \
            >/dev/null

          echo "RF-001 GitHub release published."

      - name: Verify RF-001 GitHub release publication
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(
            gh api \
              "repos/${{ github.repository }}/releases/${{ steps.release.outputs.release_id }}"
          )"

          is_draft="$(jq -r '.draft // true' <<<"$release_json")"
          tag_name="$(jq -r '.tag_name // empty' <<<"$release_json")"

          if [[ "${is_draft}" != "false" ]]; then
            echo "::error::RF-001 GitHub release is still in Draft state."
            exit 1
          fi

          if [[ "${tag_name}" != "${STAGING_TAG}" ]]; then
            echo "::error::RF-001 GitHub release tag mismatch after publication."
            exit 1
          fi

          echo "RF-001 GitHub release publication verified."

      - name: Request GitHub Pages build
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          set +e
          request_output="$(
            gh api \
              --method POST \
              "repos/${{ github.repository }}/pages/builds" \
              2>&1
          )"
          request_exit=$?
          set -e

          if [[ "${request_exit}" -eq 0 ]]; then
            echo "GitHub Pages build requested."
          else
            echo "GitHub Pages build request returned a nonzero status."
            echo "The workflow will inspect the latest build before failing."
            echo "${request_output}"
          fi

      - name: Wait for GitHub Pages build
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.published_sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            build_json="$(
              gh api \
                "repos/${{ github.repository }}/pages/builds/latest"
            )"

            status="$(jq -r '.status // empty' <<<"$build_json")"
            build_sha="$(jq -r '.commit // empty' <<<"$build_json")"

            echo "Pages build ${attempt}/60:"
            echo "Status: ${status}"
            echo "Commit: ${build_sha}"
            echo "Target: ${TARGET_SHA}"

            if [[ "${build_sha}" == "${TARGET_SHA}" \
                  && "${status}" == "built" ]]; then
              echo "GitHub Pages build completed successfully."
              exit 0
            fi

            if [[ "${build_sha}" == "${TARGET_SHA}" \
                  && "${status}" == "errored" ]]; then
              echo "::error::GitHub Pages build failed for ${TARGET_SHA}."
              exit 1
            fi

            sleep 10
          done

          echo "::error::GitHub Pages build for ${TARGET_SHA} did not complete within 10 minutes."
          exit 1

      - name: Publication summary
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          {
            echo "## XBX-RSP-RF-001 published"
            echo
            echo "**Document:** xBxBio Regulatory-by-Design Framework for Connected Cardiovascular Intelligence"
            echo
            echo "**Publication date:** September 17, 2026"
            echo
            echo "**Publication time:** 9:00 AM EDT / 13:00 UTC"
            echo
            echo "**Version:** 1.0"
            echo
            echo "**DOI:** 10.5281/zenodo.22257444"
            echo
            echo "**Zenodo deposition ID:** 22257444"
            echo
            echo "**Zenodo publication:** Verified"
            echo
            echo "**GitHub release tag:** XBX-RSP-RF-001-v1.0"
            echo
            echo "**Public page:**"
            echo "https://xbxbio.github.io/connected-cardiovascular-intelligence/publications/XBX-RSP-RF-001/"
            echo
            echo "RF-001 GitHub, GitHub Pages, and Zenodo publication completed."
          } >> "$GITHUB_STEP_SUMMARY"
