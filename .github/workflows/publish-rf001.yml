name: Publish XBX-RSP-RF-001

on:
  workflow_dispatch:
  schedule:
    # September 17, 2026 at 9:00 AM EDT = 13:00 UTC.
    - cron: "0 13 17 9 *"

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-xbx-rsp-rf-001
  cancel-in-progress: false

env:
  STAGING_TAG: "XBX-RSP-RF-001-v1.0"
  TARGET_DATE: "2026-09-17"
  TARGET_UTC: "2026-09-17T13:00:00Z"

  DEST_DIR: "publications/XBX-RSP-RF-001"
  PDF_NAME: "XBX-RSP-RF-001_xBxBio_Regulatory-by-Design_Framework_Public_Governance_Summary_v1.0.pdf"
  DOCX_NAME: "XBX-RSP-RF-001_xBxBio_Regulatory-by-Design_Framework_Public_Governance_Summary_v1.0.docx"

  EXPECTED_PDF_SHA256: "8fc11e7a49b6ac9cd3fa82287a0a6847031deb720ae15e74d12912520635ce73"
  EXPECTED_DOCX_SHA256: "76955034fa3133c41e26c7d232ed989f015482f43d927d2cfda1cb7be219fd07"
  EXPECTED_RELEASE_TITLE: "XBX-RSP-RF-001 — xBxBio Regulatory-by-Design Framework for Connected Cardiovascular Intelligence"

  ZENODO_API_BASE: "https://zenodo.org/api"
  ZENODO_DEPOSITION_ID: "22257444"
  EXPECTED_ZENODO_DOI: "10.5281/zenodo.22257444"
  EXPECTED_ZENODO_TITLE: "xBxBio Regulatory-by-Design Framework for Connected Cardiovascular Intelligence"
  EXPECTED_ZENODO_PUBLICATION_DATE: "2026-09-17"
  EXPECTED_ZENODO_VERSION: "1.0"
  EXPECTED_ZENODO_UPLOAD_TYPE: "publication"
  EXPECTED_ZENODO_PUBLICATION_TYPE: "report"
  EXPECTED_ZENODO_ACCESS_RIGHT: "open"
  EXPECTED_ZENODO_FILE_MD5: "97014e692a03d0efa636071062f05212"

  ZENODO_MAX_ATTEMPTS: "8"
  ZENODO_RETRY_DELAY_SECONDS: "15"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Determine publication mode
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          echo "GitHub event: ${GITHUB_EVENT_NAME}"

          # Manual runs are always verification-only.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Manual run detected."
            echo "This run is verification-only."
            echo "RF-001 will not be published."
            exit 0
          fi

          current_date="$(date -u +%Y-%m-%d)"
          now_epoch="$(date -u +%s)"
          target_epoch="$(date -u -d "${TARGET_UTC}" +%s)"

          # The cron expression recurs annually, so enforce the approved
          # one-time date and time inside the workflow.
          if [[ "${current_date}" != "${TARGET_DATE}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Current UTC date is ${current_date}."
            echo "Approved publication date is ${TARGET_DATE}."
            echo "No publication will occur."
            exit 0
          fi

          if (( now_epoch < target_epoch )); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Run occurred before the approved publication time."
            echo "No publication will occur."
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Approved RF-001 publication gate opened."

      - name: Verify GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          pages_json="$(
            gh api "repos/${{ github.repository }}/pages"
          )"

          build_type="$(jq -r '.build_type // empty' <<<"$pages_json")"
          source_branch="$(jq -r '.source.branch // empty' <<<"$pages_json")"
          source_path="$(jq -r '.source.path // empty' <<<"$pages_json")"

          echo "Pages build type: ${build_type}"
          echo "Pages source branch: ${source_branch}"
          echo "Pages source path: ${source_path}"

          if [[ "${build_type}" != "legacy" \
                || "${source_branch}" != "main" \
                || "${source_path}" != "/" ]]; then
            echo "::error::GitHub Pages must remain configured for main / (root) branch deployment."
            exit 1
          fi

      - name: Locate RF-001 release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(
            gh api --paginate \
              "repos/${{ github.repository }}/releases?per_page=100" |
            jq -s \
              --arg tag "${STAGING_TAG}" \
              'add | map(select(.tag_name == $tag)) | first'
          )"

          if [[ -z "${release_json}" || "${release_json}" == "null" ]]; then
            echo "::error::RF-001 release with tag ${STAGING_TAG} was not found."
            exit 1
          fi

          release_id="$(jq -r '.id // empty' <<<"$release_json")"
          release_title="$(jq -r '.name // empty' <<<"$release_json")"
          release_is_draft="$(jq -r '.draft // false' <<<"$release_json")"

          if [[ -z "${release_id}" ]]; then
            echo "::error::Unable to determine RF-001 release ID."
            exit 1
          fi

          if [[ "${release_title}" != "${EXPECTED_RELEASE_TITLE}" ]]; then
            echo "::error::RF-001 release title mismatch."
            echo "Expected: ${EXPECTED_RELEASE_TITLE}"
            echo "Actual:   ${release_title}"
            exit 1
          fi

          # Before the approved publication time, a manual verification
          # run must still find the GitHub release in Draft state.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            now_epoch="$(date -u +%s)"
            target_epoch="$(date -u -d "${TARGET_UTC}" +%s)"

            if (( now_epoch < target_epoch )) \
               && [[ "${release_is_draft}" != "true" ]]; then
              echo "::error::RF-001 GitHub release is already public before the approved publication time."
              exit 1
            fi
          fi

          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "is_draft=${release_is_draft}" >> "$GITHUB_OUTPUT"

          echo "RF-001 release located."
          echo "Release ID: ${release_id}"
          echo "Draft state: ${release_is_draft}"

      - name: Verify RF-001 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(
            gh api \
              "repos/${{ github.repository }}/releases/${{ steps.release.outputs.release_id }}"
          )"

          release_body="$(jq -r '.body // ""' <<<"$release_json")"

          for required_text in \
            "September 17, 2026" \
            "10.5281/zenodo.22257444" \
            "This draft release is a staging mechanism only"; do

            if ! grep -Fq "${required_text}" <<<"${release_body}"; then
              echo "::error::Release notes are missing required text: ${required_text}"
              exit 1
            fi
          done

          echo "RF-001 release notes verified."

      - name: Download staged RF-001 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(
            gh api \
              "repos/${{ github.repository }}/releases/${{ steps.release.outputs.release_id }}"
          )"

          asset_count="$(jq -r '.assets | length' <<<"$release_json")"

          if [[ "${asset_count}" -ne 2 ]]; then
            echo "::error::Expected exactly 2 RF-001 assets; found ${asset_count}."
            exit 1
          fi

          mkdir -p /tmp/rf001-stage

          for name in "${PDF_NAME}" "${DOCX_NAME}"; do

            asset_id="$(
              jq -r \
                --arg name "${name}" \
                '.assets[] | select(.name == $name) | .id' \
                <<<"$release_json"
            )"

            if [[ -z "${asset_id}" || "${asset_id}" == "null" ]]; then
              echo "::error::Missing required staged asset: ${name}"
              exit 1
            fi

            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${{ github.repository }}/releases/assets/${asset_id}" \
              > "/tmp/rf001-stage/${name}"

            if [[ ! -s "/tmp/rf001-stage/${name}" ]]; then
              echo "::error::Downloaded staged asset is empty: ${name}"
              exit 1
            fi

            echo "Downloaded staged asset: ${name}"
          done

      - name: Verify staged-file integrity
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(head -c 5 "/tmp/rf001-stage/${PDF_NAME}")" != "%PDF-" ]]; then
            echo "::error::PDF signature check failed."
            exit 1
          fi

          if ! unzip -t "/tmp/rf001-stage/${DOCX_NAME}" >/dev/null; then
            echo "::error::DOCX package integrity check failed."
            exit 1
          fi

          pdf_sha="$(
            sha256sum "/tmp/rf001-stage/${PDF_NAME}" |
            awk '{print $1}'
          )"

          docx_sha="$(
            sha256sum "/tmp/rf001-stage/${DOCX_NAME}" |
            awk '{print $1}'
          )"

          echo "${PDF_NAME} SHA-256: ${pdf_sha}"
          echo "${DOCX_NAME} SHA-256: ${docx_sha}"

          if [[ "${pdf_sha}" != "${EXPECTED_PDF_SHA256}" ]]; then
            echo "::error::RF-001 PDF hash mismatch."
            echo "Expected: ${EXPECTED_PDF_SHA256}"
            echo "Actual:   ${pdf_sha}"
            exit 1
          fi

          if [[ "${docx_sha}" != "${EXPECTED_DOCX_SHA256}" ]]; then
            echo "::error::RF-001 DOCX hash mismatch."
            echo "Expected: ${EXPECTED_DOCX_SHA256}"
            echo "Actual:   ${docx_sha}"
            exit 1
          fi

          echo "RF-001 staged-file integrity verified."

      - name: Create RF-001 Zenodo control helper
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/zenodo_rf001.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import socket
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from typing import Any


          API_BASE = os.environ.get(
              "ZENODO_API_BASE",
              "https://zenodo.org/api",
          ).rstrip("/")

          TOKEN = os.environ.get("ZENODO_TOKEN", "").strip()
          DEPOSITION_ID = os.environ["ZENODO_DEPOSITION_ID"].strip()

          EXPECTED_DOI = os.environ["EXPECTED_ZENODO_DOI"].strip()
          EXPECTED_TITLE = os.environ["EXPECTED_ZENODO_TITLE"].strip()
          EXPECTED_PUBLICATION_DATE = os.environ[
              "EXPECTED_ZENODO_PUBLICATION_DATE"
          ].strip()
          EXPECTED_VERSION = os.environ["EXPECTED_ZENODO_VERSION"].strip()
          EXPECTED_UPLOAD_TYPE = os.environ[
              "EXPECTED_ZENODO_UPLOAD_TYPE"
          ].strip()
          EXPECTED_PUBLICATION_TYPE = os.environ[
              "EXPECTED_ZENODO_PUBLICATION_TYPE"
          ].strip()
          EXPECTED_ACCESS_RIGHT = os.environ[
              "EXPECTED_ZENODO_ACCESS_RIGHT"
          ].strip()
          EXPECTED_FILE_MD5 = os.environ[
              "EXPECTED_ZENODO_FILE_MD5"
          ].strip().lower()

          MAX_ATTEMPTS = int(os.environ.get("ZENODO_MAX_ATTEMPTS", "8"))
          RETRY_DELAY_SECONDS = int(
              os.environ.get("ZENODO_RETRY_DELAY_SECONDS", "15")
          )

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/json",
              "User-Agent": "xBxBio-GitHub-Actions-RF001/1.0",
          }


          def fail(message: str, details: str = "") -> None:
              print(f"::error::{message}")
              if details:
                  print(details[:2000])
              raise SystemExit(1)


          def is_transient(status: int) -> bool:
              return (
                  status == 0
                  or status in {408, 425, 429}
                  or 500 <= status <= 599
              )


          def request_json(
              url: str,
              *,
              method: str = "GET",
              timeout: int = 45,
              authenticated: bool = True,
          ) -> tuple[int, Any, str]:
              headers = dict(HEADERS) if authenticated else {
                  "Accept": "application/json",
                  "User-Agent": "xBxBio-GitHub-Actions-RF001/1.0",
              }

              data = None
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=timeout,
                  ) as response:
                      raw = response.read()
                      status = int(response.getcode())

              except urllib.error.HTTPError as error:
                  status = int(error.code)
                  raw = error.read()

              except (
                  urllib.error.URLError,
                  TimeoutError,
                  socket.timeout,
              ) as error:
                  return 0, None, str(error)

              text = raw.decode("utf-8", errors="replace")

              if not text.strip():
                  return status, None, ""

              try:
                  payload = json.loads(text)
              except json.JSONDecodeError:
                  payload = None

              return status, payload, text


          def extract_items(payload: Any) -> list[dict[str, Any]]:
              if isinstance(payload, list):
                  return [
                      item
                      for item in payload
                      if isinstance(item, dict)
                  ]

              if isinstance(payload, dict):
                  hits = payload.get("hits")

                  if isinstance(hits, dict):
                      items = hits.get("hits", [])
                      if isinstance(items, list):
                          return [
                              item
                              for item in items
                              if isinstance(item, dict)
                          ]

              return []


          def fetch_files_with_retry() -> list[dict[str, Any]]:
              url = (
                  f"{API_BASE}/deposit/depositions/"
                  f"{DEPOSITION_ID}/files"
              )
              last_details = ""

              for attempt in range(1, MAX_ATTEMPTS + 1):
                  status, payload, text = request_json(url)

                  print(
                      "Zenodo files request "
                      f"{attempt}/{MAX_ATTEMPTS}: HTTP {status}"
                  )

                  if status == 200 and isinstance(payload, list):
                      return [
                          item
                          for item in payload
                          if isinstance(item, dict)
                      ]

                  if status in {401, 403, 404}:
                      fail(
                          "Zenodo files request returned a permanent error.",
                          text,
                      )

                  last_details = text

                  if not is_transient(status):
                      fail(
                          f"Unexpected Zenodo files HTTP status: {status}",
                          text,
                      )

                  if attempt < MAX_ATTEMPTS:
                      time.sleep(RETRY_DELAY_SECONDS)

              fail(
                  "Unable to retrieve RF-001 Zenodo files after retries.",
                  last_details,
              )
              return []


          def fetch_deposition_with_retry() -> dict[str, Any]:
              direct_url = (
                  f"{API_BASE}/deposit/depositions/{DEPOSITION_ID}"
              )
              list_url = (
                  f"{API_BASE}/deposit/depositions"
                  "?size=100&all_versions=true&sort=-mostrecent"
              )

              last_details = ""

              for attempt in range(1, MAX_ATTEMPTS + 1):
                  direct_status, direct_payload, direct_text = request_json(
                      direct_url
                  )

                  print(
                      "Zenodo direct request "
                      f"{attempt}/{MAX_ATTEMPTS}: "
                      f"HTTP {direct_status}"
                  )

                  if (
                      direct_status == 200
                      and isinstance(direct_payload, dict)
                  ):
                      return direct_payload

                  if direct_status in {401, 403, 404}:
                      fail(
                          "Zenodo direct deposition request returned "
                          "a permanent error.",
                          direct_text,
                      )

                  list_status, list_payload, list_text = request_json(
                      list_url
                  )

                  print(
                      "Zenodo list fallback "
                      f"{attempt}/{MAX_ATTEMPTS}: "
                      f"HTTP {list_status}"
                  )

                  if list_status == 200:
                      for item in extract_items(list_payload):
                          if str(item.get("id", "")) == DEPOSITION_ID:
                              print(
                                  "RF-001 deposition found through "
                                  "the list fallback."
                              )
                              return item

                  if list_status in {401, 403}:
                      fail(
                          "Zenodo list fallback returned an "
                          "authorization error.",
                          list_text,
                      )

                  last_details = (
                      direct_text
                      or list_text
                      or f"Direct HTTP {direct_status}; "
                         f"list HTTP {list_status}"
                  )

                  direct_retryable = is_transient(direct_status)
                  list_retryable = is_transient(list_status)

                  if not direct_retryable and not list_retryable:
                      fail(
                          "Zenodo deposition could not be retrieved.",
                          last_details,
                      )

                  if attempt < MAX_ATTEMPTS:
                      wait_seconds = min(
                          RETRY_DELAY_SECONDS * attempt,
                          60,
                      )
                      print(
                          "Zenodo is temporarily unavailable. "
                          f"Retrying in {wait_seconds} seconds."
                      )
                      time.sleep(wait_seconds)

              fail(
                  "Unable to retrieve the RF-001 Zenodo deposition "
                  "after all retry attempts.",
                  last_details,
              )
              return {}


          def first_nonempty(*values: Any) -> str:
              for value in values:
                  if isinstance(value, str) and value.strip():
                      return value.strip()
              return ""


          def normalize_checksum(value: Any) -> str:
              checksum = str(value or "").strip().lower()
              if checksum.startswith("md5:"):
                  checksum = checksum[4:]
              return checksum


          def validate_deposition(
              record: dict[str, Any],
          ) -> bool:
              metadata = record.get("metadata")
              if not isinstance(metadata, dict):
                  metadata = {}

              actual_id = str(
                  record.get("id")
                  or record.get("record_id")
                  or ""
              )

              actual_title = first_nonempty(
                  metadata.get("title"),
                  record.get("title"),
              )

              prereserve = metadata.get("prereserve_doi")
              if not isinstance(prereserve, dict):
                  prereserve = {}

              actual_doi = first_nonempty(
                  record.get("doi"),
                  prereserve.get("doi"),
              )

              actual_publication_date = str(
                  metadata.get("publication_date") or ""
              )
              actual_version = str(metadata.get("version") or "")
              actual_upload_type = str(
                  metadata.get("upload_type") or ""
              )
              actual_publication_type = str(
                  metadata.get("publication_type") or ""
              )
              actual_access_right = str(
                  metadata.get("access_right") or ""
              )

              state = str(record.get("state") or "")
              submitted_raw = record.get("submitted", False)
              submitted = (
                  submitted_raw is True
                  or str(submitted_raw).lower() == "true"
              )

              files = record.get("files")
              if not isinstance(files, list) or not files:
                  files = fetch_files_with_retry()

              print(f"Zenodo deposition ID: {actual_id}")
              print(f"Zenodo title: {actual_title}")
              print(f"Zenodo DOI: {actual_doi}")
              print(
                  "Zenodo publication date: "
                  f"{actual_publication_date}"
              )
              print(f"Zenodo version: {actual_version}")
              print(f"Zenodo upload type: {actual_upload_type}")
              print(
                  "Zenodo publication type: "
                  f"{actual_publication_type}"
              )
              print(f"Zenodo access right: {actual_access_right}")
              print(f"Zenodo state: {state}")
              print(f"Zenodo submitted: {submitted}")
              print(f"Zenodo file count: {len(files)}")

              if actual_id != DEPOSITION_ID:
                  fail(
                      "Zenodo deposition ID mismatch. "
                      f"Expected {DEPOSITION_ID}; "
                      f"found {actual_id}."
                  )

              if actual_title != EXPECTED_TITLE:
                  fail(
                      "Zenodo title mismatch. "
                      f"Expected {EXPECTED_TITLE!r}; "
                      f"found {actual_title!r}."
                  )

              if actual_doi != EXPECTED_DOI:
                  fail(
                      "Zenodo DOI mismatch. "
                      f"Expected {EXPECTED_DOI}; "
                      f"found {actual_doi}."
                  )

              expected_metadata = {
                  "publication_date": (
                      EXPECTED_PUBLICATION_DATE,
                      actual_publication_date,
                  ),
                  "version": (
                      EXPECTED_VERSION,
                      actual_version,
                  ),
                  "upload_type": (
                      EXPECTED_UPLOAD_TYPE,
                      actual_upload_type,
                  ),
                  "publication_type": (
                      EXPECTED_PUBLICATION_TYPE,
                      actual_publication_type,
                  ),
                  "access_right": (
                      EXPECTED_ACCESS_RIGHT,
                      actual_access_right,
                  ),
              }

              for field, (expected, actual) in expected_metadata.items():
                  if actual != expected:
                      fail(
                          f"Zenodo {field} mismatch. "
                          f"Expected {expected!r}; "
                          f"found {actual!r}."
                      )

              if len(files) != 1:
                  fail(
                      "RF-001 Zenodo deposition must contain "
                      f"exactly one file; found {len(files)}."
                  )

              zenodo_file = files[0]
              if not isinstance(zenodo_file, dict):
                  fail("Zenodo file metadata is not valid.")

              file_name = first_nonempty(
                  zenodo_file.get("filename"),
                  zenodo_file.get("key"),
                  zenodo_file.get("name"),
              )
              file_md5 = normalize_checksum(
                  zenodo_file.get("checksum")
              )

              print(f"Zenodo file name: {file_name}")
              print(f"Zenodo file MD5: {file_md5}")

              if (
                  "XBX-RSP-RF-001" not in file_name
                  or not file_name.lower().endswith(".pdf")
              ):
                  fail(
                      "Unexpected RF-001 Zenodo filename: "
                      f"{file_name!r}."
                  )

              if file_md5 != EXPECTED_FILE_MD5:
                  fail(
                      "Zenodo RF-001 PDF checksum mismatch. "
                      f"Expected {EXPECTED_FILE_MD5}; "
                      f"found {file_md5}."
                  )

              published = submitted and state == "done"
              draft = (
                  not submitted
                  and state in {"unsubmitted", "inprogress"}
              )

              if not published and not draft:
                  fail(
                      "Unexpected Zenodo deposition state: "
                      f"state={state!r}, submitted={submitted!r}."
                  )

              return published


          def public_record_matches() -> bool:
              url = f"{API_BASE}/records/{DEPOSITION_ID}"
              status, payload, _ = request_json(
                  url,
                  authenticated=False,
                  timeout=20,
              )

              print(f"Zenodo public-record check: HTTP {status}")

              if status != 200 or not isinstance(payload, dict):
                  return False

              metadata = payload.get("metadata")
              if not isinstance(metadata, dict):
                  metadata = {}

              title = first_nonempty(
                  metadata.get("title"),
                  payload.get("title"),
              )
              doi = first_nonempty(
                  payload.get("doi"),
                  metadata.get("doi"),
                  (
                      payload.get("pids", {})
                      .get("doi", {})
                      .get("identifier", "")
                      if isinstance(payload.get("pids"), dict)
                      and isinstance(
                          payload.get("pids", {}).get("doi"),
                          dict,
                      )
                      else ""
                  ),
              )

              return doi == EXPECTED_DOI and title == EXPECTED_TITLE


          def deposition_reports_published() -> bool:
              url = (
                  f"{API_BASE}/deposit/depositions/{DEPOSITION_ID}"
              )
              status, payload, _ = request_json(
                  url,
                  timeout=30,
              )

              print(f"Zenodo deposition-state check: HTTP {status}")

              if status != 200 or not isinstance(payload, dict):
                  return False

              state = str(payload.get("state") or "")
              submitted_raw = payload.get("submitted", False)
              submitted = (
                  submitted_raw is True
                  or str(submitted_raw).lower() == "true"
              )

              metadata = payload.get("metadata")
              if not isinstance(metadata, dict):
                  metadata = {}

              prereserve = metadata.get("prereserve_doi")
              if not isinstance(prereserve, dict):
                  prereserve = {}

              doi = first_nonempty(
                  payload.get("doi"),
                  prereserve.get("doi"),
              )

              return (
                  state == "done"
                  and submitted
                  and doi == EXPECTED_DOI
              )


          def poll_until_published(
              *,
              attempts: int,
              delay_seconds: int,
          ) -> bool:
              for attempt in range(1, attempts + 1):
                  print(
                      "Zenodo publication verification "
                      f"{attempt}/{attempts}"
                  )

                  if public_record_matches():
                      print(
                          "Zenodo public record is available "
                          "with the expected DOI and title."
                      )
                      return True

                  if deposition_reports_published():
                      print(
                          "Zenodo deposition reports state=done "
                          "and submitted=true."
                      )
                      return True

                  if attempt < attempts:
                      time.sleep(delay_seconds)

              return False


          def preflight() -> None:
              if not TOKEN:
                  fail("GitHub secret ZENODO_TOKEN is missing.")

              record = fetch_deposition_with_retry()
              published = validate_deposition(record)

              # Before the approved publication time, a manual run must
              # still find the Zenodo record as an unpublished draft.
              if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
                  target_text = os.environ["TARGET_UTC"]
                  target = datetime.fromisoformat(
                      target_text.replace("Z", "+00:00")
                  )
                  now = datetime.now(timezone.utc)

                  if now < target and published:
                      fail(
                          "RF-001 Zenodo record is already public "
                          "before the approved publication time."
                      )

              output_file = os.environ.get("GITHUB_OUTPUT")
              if output_file:
                  with open(
                      output_file,
                      "a",
                      encoding="utf-8",
                  ) as stream:
                      stream.write(
                          "published="
                          f"{str(published).lower()}\n"
                      )

              if published:
                  print(
                      "RF-001 Zenodo record is already published "
                      "and matches the approved identity."
                  )
              else:
                  print(
                      "RF-001 Zenodo draft, files, metadata, DOI, "
                      "and API credentials verified."
                  )


          def publish() -> None:
              if not TOKEN:
                  fail("GitHub secret ZENODO_TOKEN is missing.")

              record = fetch_deposition_with_retry()
              already_published = validate_deposition(record)

              if already_published:
                  if poll_until_published(
                      attempts=3,
                      delay_seconds=10,
                  ):
                      print(
                          "RF-001 was already published in Zenodo; "
                          "no duplicate publish request was sent."
                      )
                      return

                  fail(
                      "Zenodo deposition says published, but the "
                      "published state could not be independently "
                      "confirmed."
                  )

              publish_url = (
                  f"{API_BASE}/deposit/depositions/"
                  f"{DEPOSITION_ID}/actions/publish"
              )

              post_attempts = 4

              for attempt in range(1, post_attempts + 1):
                  status, _, text = request_json(
                      publish_url,
                      method="POST",
                      timeout=90,
                  )

                  print(
                      "Zenodo publish request "
                      f"{attempt}/{post_attempts}: HTTP {status}"
                  )

                  if status in {401, 403, 404}:
                      fail(
                          "Zenodo publish request returned a "
                          "permanent authorization or record error.",
                          text,
                      )

                  if status == 202:
                      print(
                          "Zenodo accepted the RF-001 publication "
                          "request."
                      )

                      if poll_until_published(
                          attempts=30,
                          delay_seconds=10,
                      ):
                          print(
                              "RF-001 Zenodo publication verified."
                          )
                          return

                      fail(
                          "Zenodo accepted publication, but RF-001 "
                          "was not confirmed as published within "
                          "the verification window."
                      )

                  # A proxy timeout can occur after Zenodo accepted
                  # the POST. Check public/deposition state before
                  # sending another publish request.
                  if poll_until_published(
                      attempts=6,
                      delay_seconds=10,
                  ):
                      print(
                          "RF-001 Zenodo publication succeeded "
                          "despite an ambiguous POST response."
                      )
                      return

                  if not is_transient(status) and status != 409:
                      fail(
                          "Zenodo rejected the RF-001 publish "
                          f"request with HTTP {status}.",
                          text,
                      )

                  if attempt < post_attempts:
                      wait_seconds = min(
                          RETRY_DELAY_SECONDS * attempt,
                          60,
                      )
                      print(
                          "Zenodo remains temporarily unavailable. "
                          f"Retrying publication in "
                          f"{wait_seconds} seconds."
                      )
                      time.sleep(wait_seconds)

              fail(
                  "RF-001 Zenodo publication was not confirmed "
                  "after all retry attempts."
              )


          def main() -> None:
              if len(sys.argv) != 2:
                  fail(
                      "Usage: zenodo_rf001.py "
                      "<preflight|publish>"
                  )

              command = sys.argv[1]

              if command == "preflight":
                  preflight()
              elif command == "publish":
                  publish()
              else:
                  fail(f"Unknown command: {command}")


          if __name__ == "__main__":
              main()
          PY

          python3 -m py_compile /tmp/zenodo_rf001.py
          echo "RF-001 Zenodo helper created and syntax-checked."

      - name: Verify RF-001 Zenodo draft and credentials
        id: zenodo_preflight
        shell: bash
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          python3 /tmp/zenodo_rf001.py preflight

      - name: Stop after verification on manual or non-target runs
        if: steps.gate.outputs.publish != 'true'
        shell: bash
        run: |
          {
            echo "## XBX-RSP-RF-001 verification successful"
            echo
            echo "**GitHub staging release:** Verified"
            echo
            echo "**GitHub staged files and SHA-256 hashes:** Verified"
            echo
            echo "**Zenodo deposition ID:** 22257444"
            echo
            echo "**Zenodo draft, metadata, file checksum, DOI, and credentials:** Verified"
            echo
            echo "**Publication performed:** No"
            echo
            echo "RF-001 remains scheduled for September 17, 2026 at 9:00 AM EDT / 13:00 UTC."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RF-001 verification successful."
          echo "No GitHub or Zenodo publication occurred."

      - name: Prepare RF-001 files in GitHub Pages source
